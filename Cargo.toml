[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Pixel loops are unusable unoptimised; keep debug builds debuggable everywhere else.
[profile.dev.package.ro-vision]
opt-level = 3
