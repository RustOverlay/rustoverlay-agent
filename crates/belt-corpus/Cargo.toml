[package]
name = "belt-corpus"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ro-core = { path = "../ro-core" }
ro-vision = { path = "../ro-vision" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
regex = "1.13"

[target.'cfg(windows)'.dependencies]
ro-capture = { path = "../ro-capture" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_Graphics_GdiPlus", "Win32_System_Threading"]
